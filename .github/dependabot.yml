version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    ignore:
      # The app was moved to Next 15.5 to pick up the patched release. Next 16
      # needs React 19 and removes `next lint`, which `npm run lint` still uses,
      # so hold both packages on the 15.x line until that migration is done.
      - dependency-name: next
        versions: [">=16"]
      - dependency-name: eslint-config-next
        versions: [">=16"]
      - dependency-name: react
        versions: [">=19"]
      - dependency-name: react-dom
        versions: [">=19"]
      # TypeScript 7 removed the `baseUrl` compiler option and ESLint 9
      # rewrote the flat-config defaults; both are breaking upgrades for this
      # app, so they stay manual.
      - dependency-name: typescript
        versions: [">=6"]
      - dependency-name: eslint
        versions: [">=9"]
      - dependency-name: "@typescript-eslint/eslint-plugin"
        versions: [">=8"]
      - dependency-name: "@typescript-eslint/parser"
        versions: [">=8"]
